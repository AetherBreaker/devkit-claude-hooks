[package]
  name    = "devkit-claude-hooks"
  version = "1.0.0"
  edition = "2024"
  publish = false

[lib]
  name = "devkit_claude_hooks"

[[bin]]
  name = "devkit-hook"
  path = "src/main.rs"

[dependencies]
  anyhow     = "1.0.104"
  clap       = { version = "4", features = ["derive"] }
  regex      = "1.13.1"
  serde      = { version = "1.0.229", features = ["derive"] }
  serde_json = { version = "1.0.151", features = ["preserve_order"] }

[dev-dependencies]
  tempfile = "3.27.0"

[profile.release]
  strip       = true
  incremental = true
