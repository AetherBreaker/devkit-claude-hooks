name: "Verify: Rust checks, wheel"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: fmt, clippy, tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  wheel:
    name: "Wheel: maturin build, run devkit-hook --version (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # The wheel is what every project installs: the binary must ride in it as a script.
      - name: maturin build, assert the devkit-hook script is in the wheel, maturin develop, devkit-hook --version
        shell: bash
        run: |
          uv sync
          uv run maturin build --release --out dist
          uv run python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(n.endswith('scripts/devkit-hook') or n.endswith('scripts/devkit-hook.exe') for n in names), names; assert 'devkit_claude_hooks/__init__.py' in names, names"
          uv run maturin develop
          uv run --no-sync devkit-hook --version
